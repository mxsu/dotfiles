$mainMod = SUPER
$rofi = rofi -show drun -kb-cancel Super_L -theme /home/mellow/.config/rofi/launchers/type-7/style-2-mellow.rasi 
$browser = flatpak run app.zen_browser.zen
$discord = flatpak run dev.vencord.Vesktop
$obsidian = flatpak run md.obsidian.Obsidian
$toggle = /home/mellow/scripts/togglefloatcenter.sh

#Mouse Binds
bindm=$mainMod,mouse:272,movewindow
bindm=$mainMod,mouse:273,resizewindow

bind=SUPERSHIFT,B,exec, $browser
bind=$mainMod,Return,exec,kitty
bind=SUPERSHIFT,V,exec,pwvucontrol
bind=SUPERSHIFT,Q,exec,wlogout -p layer-shell
bind=$mainMod,L,exec, qs -c noctalia-shell ipc call sessionMenu toggle
#bind=$mainMod,L,exec, wlogout -p layer-shell

bind=SUPERSHIFT, E, exec, code
bind=SUPERSHIFT,F,exec,nemo
bind=$mainMod,Escape,exec,hyprctl reload
bind=$mainMod,Escape,exec,notify-send "Config Reloaded"

bind=SUPERALT,space,togglefloating
bind=SUPERALT,space,resizeactive, exact 75% 75%
bind=SUPERALT,space,centerwindow

#bind=$mainMod Alt, exec, $toggle
bind=SUPERSHIFT,space, togglesplit,
bind=$mainMod,P,pin
bind=$mainMod,Q,killactive,
#bind=Alt,F4,killactive,
bind=SUPERCONTROL,Q,exec,hyprctl kill
bind=$mainMod,F,fullscreen, 1
bind=SUPERALT,F,fullscreen, 0s

bindle=,XF86AudioRaiseVolume,exec,pamixer -i 5
bindle=,XF86AudioLowerVolume,exec,pamixer -d 5 
bindl=,XF86AudioMute,exec,pamixer -t 
bindle=,XF86MonBrightnessUp,exec,brightnessctl set +5% 
bindle=,XF86MonBrightnessDown,exec,brightnessctl set 5%-
bind=,XF86Calculator,exec,kcalc
bindl=,XF86AudioPlay,exec,playerctl play-pause
bindl=$mainMod,m,exec,playerctl play-pause
bindl=,XF86AudioStop,exec,playerctl stop
bindl=$mainMod,slash,exec,playerctl stop
bindl=,XF86AudioPrev,exec,playerctl previous
bindl=$mainMod,comma,exec,playerctl previous
bindl=,XF86AudioNext,exec,playerctl next
bindl=$mainMod,period,exec,playerctl next

#bind=$mainMod,d,exec,pikabar-launcher
bind=$mainMod,d,exec,$rofi

#WINDOWS
bind=$mainMod,left,movefocus,l
bind=$mainMod,right,movefocus,r
bind=$mainMod,up,movefocus,u
bind=$mainMod,down,movefocus,d
bind=SUPERSHIFT,left,movewindow,l
bind=SUPERSHIFT,right,movewindow,r
bind=SUPERSHIFT,up,movewindow,u
bind=SUPERSHIFT,down,movewindow,d

#WORKSPACE MANAGEMENT
bind=SUPERCONTROL,up,movetoworkspace,-1
bind=SUPERCONTROL,down,movetoworkspace,+1
bind=SUPERCONTROL,left,workspace,-1
bind=$mainMod,page_up,workspace,-1
bind=SUPERCONTROL,right,workspace,+1
bind=$mainMod,page_down,workspace,+1
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5 
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod Control, s, togglespecialworkspace, music
bind = $mainMod ALT, S, movetoworkspace, special:music
bind = $mainMod Shift, s, exec, [float;size75% 75%;center] spotify
bind = $mainMod Control,d, togglespecialworkspace, chat
bind = $mainMod Alt, d, movetoworkspace, special:chat
bind = $mainMod Shift, d, exec, $discord
bind = $mainMod Control, a, togglespecialworkspace, note
bind = $mainMod ALT, a, movetoworkspace, special:note
bind = $mainMod SHIFT, a, exec, $obsidian
bind = $mainMod Control, x, togglespecialworkspace, special
bind = $mainMod ALT, x, movetoworkspace, special


bind = $mainMod ALT, Return, exec, [float;size70% 70%;center] kitty
bind=SUPERCONTROL,up,focusmonitor,l
bind=SUPERCONTROL,down,focusmonitor,r
bind=$mainMod,tab,workspace,previous
bind=SUPERALT,left,resizeactive,-20 0
bind=SUPERALT,right,resizeactive,20 0
bind=SUPERALT,up,resizeactive,0 -20
bind=SUPERALT,down,resizeactive,0 20

bind=$mainMod,F12,exec,hyprctl keyword misc:no_vfr 0
bind=SUPERALT,F12,exec,hyprctl keyword misc:no_vfr 1

bind=,Print,exec,wayfreeze & PID=$!; sleep .1; grim -g "$(slurp)" - | wl-copy; kill $PID
bind=SHIFT,Print,exec,/usr/bin/grimshot --notify save screen
bind=CTRLSHIFT,Print,exec,/usr/bin/grimshot --notify copy screen
bind=CTRL,Print,exec,/usr/bin/grimshot --notify save area

#KITTY MODS
bind = $mainMod, C, sendshortcut, CTRL, C,^(?:(?!kitt.*).*)$
bind = $mainMod, V, sendshortcut, CTRL, V,^(?:(?!kitt.*).*)$

$kittyMod = CTRL_SHIFT
bind = $mainMod, C, sendshortcut, $kittyMod, C,^kitt.*$
bind = $mainMod, V, sendshortcut, $kittyMod, V,^kitt.*$

bind = $mainMod, O, exec, hyprctl setprop active opaque toggle

bind=$mainMod,Delete,exec,sh -c "sleep 1 && hyprctl dispatch dpms off eDP-1 && sleep 600 && loginctl lock-session"

bind=$mainMod,Insert,exec,sh -c "hyprctl dispatch dpms on eDP-1"

bind = $mainMod SHIFT ALT, RIGHT, movecurrentworkspacetomonitor, +1

bind = $mainMod SHIFT ALT, LEFT, movecurrentworkspacetomonitor, -1 
